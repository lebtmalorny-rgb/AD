# Install the post-deploy hook first; see POSTDEPLOY.md.
pvs_rbac_enabled: true
pvs_ad_domain: AD
pvs_ad_groups:
  virtualization_admin: PVS_VirtAdmins
  vm_developer: PVS_VMDevelopers
  security_admin: PVS_SecurityAudit
pvs_keystone_project: PVS
pvs_keystone_project_domain: Default

# Confirm Keystone permits admin as an implied role; see keystone-rbac.conf.
pvs_admin_implied_role_ready: false

# Set true only after applying and testing ALL vm_developer API restrictions.
# This acknowledgement does not inspect/validate the effective policies.
pvs_vm_developer_policy_ready: false
pvs_keystone_assignments:
  - role: virtualization_admin
    state: present
  - role: vm_developer
    state: present
