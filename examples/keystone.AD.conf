# Template processed by Kolla on the deployment host.
[identity]
driver = ldap

[ldap]
url = ldaps://{{ pvs_ad_host }}:636
user = {{ pvs_ad_bind_dn }}
password = {{ pvs_ad_bind_password }}
suffix = DC=example,DC=local
query_scope = sub
page_size = 1000
chase_referrals = false
tls_cacertfile = /var/lib/kolla/share/ca-certificates/ad-ca.crt
tls_req_cert = demand

user_tree_dn = {{ pvs_ad_base_dn }}
user_objectclass = user
user_id_attribute = sAMAccountName
user_name_attribute = sAMAccountName
user_enabled_attribute = userAccountControl
user_enabled_mask = 2
user_enabled_default = 512
user_filter = (|(memberOf=CN=PVS_VirtAdmins,{{ pvs_ad_base_dn }})(memberOf=CN=PVS_VMDevelopers,{{ pvs_ad_base_dn }}))

group_tree_dn = {{ pvs_ad_base_dn }}
group_objectclass = group
group_id_attribute = cn
group_name_attribute = cn
group_member_attribute = member
group_members_are_ids = false
group_filter = (|(cn=PVS_VirtAdmins)(cn=PVS_VMDevelopers))
